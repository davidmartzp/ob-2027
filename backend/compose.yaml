# Local development only (production runs on the hosting's Apache + PHP).
# Credentials come from .env (copy .env.example): never written here.
name: origami-backend

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${API_HOST_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Same engine as the hosting (MariaDB 10.11).
  db:
    image: mariadb:10.11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Test inbox: catches every email (UI at http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_HOST_PORT:-8025}:8025"

  # Mail queue worker (like the hosting's cron, every minute). Enabled once `mail:send`
  # exists (task group 4): docker compose --profile queue up -d
  queue:
    profiles: ["queue"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MAILER_DSN: smtp://mailpit:1025
    command: ["sh", "-c", "while true; do php bin/console mail:send; sleep 60; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
