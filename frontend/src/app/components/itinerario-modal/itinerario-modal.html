<dialog #dialogo class="modal" aria-labelledby="itinerario-titulo" (click)="alHacerClic($event)">
  <div class="hoja">
    <header class="cabeza">
      <div>
        <h2 id="itinerario-titulo" class="rico" [innerHTML]="t.titulo"></h2>
      </div>
      <button type="button" class="cerrar" [attr.aria-label]="t.cerrar" (click)="cerrar()">×</button>
    </header>

    <ol class="momentos">
      @for (m of momentos; track m.momento) {
        <li>
          <h3>{{ m.momento }}</h3>
          @for (p of m.parrafos; track $index) {
            <p>{{ p }}</p>
          }
        </li>
      }
    </ol>

    <p class="credito"><span class="anotacion">{{ credito }}</span></p>
  </div>
</dialog>
