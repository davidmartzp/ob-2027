<section class="itinerario" id="itinerario">
  <div class="inner">
    <div>
      <app-separador appReveal/>
      <h2 class="titulo rico" appReveal="1" [innerHTML]="t.titulo"></h2>
      <p appReveal="2">{{ t.texto }}</p>
      <svg class="flecha-doblar" appReveal="3" viewBox="0 0 64 44" aria-hidden="true">
        <path d="M4 6 C 30 -6, 54 8, 44 30 M44 30 l-8 -3 M44 30 l2 -8"/>
      </svg>
    </div>
    <div class="acciones" appReveal="2">
      <button type="button" class="btn btn-claro" aria-haspopup="dialog" (click)="modal.abrir()">{{ t.verCompleto }}</button>
      @if (recursosVisible) {
        <a class="recursos-link" appEnlace="recursos">{{ t.recursos }}</a>
      }
      <p class="aviso rico" [innerHTML]="t.aviso"></p>
    </div>
  </div>
  <div class="cerros" aria-hidden="true">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <path d="M0 150 L0 96 L170 58 L330 100 L480 42 L610 104 L770 62 L930 108 L1090 48 L1250 94 L1440 72 L1440 150 Z" style="fill:var(--cerro-lejano)" opacity=".55"/>
      <path d="M0 150 L0 118 L210 84 L380 122 L560 78 L740 126 L920 88 L1120 130 L1300 92 L1440 116 L1440 150 Z" style="fill:var(--cerro-cercano)"/>
      <g stroke="currentColor" stroke-width="1" fill="none" opacity=".3">
        <path d="M480 42 L560 150" stroke-dasharray="6 6"/>
        <path d="M1090 48 L1010 150" stroke-dasharray="3 5 8 5"/>
        <path d="M170 58 L250 150" stroke-dasharray="6 6"/>
      </g>
      <path d="M474 42 l6 -12 l6 12 M480 26 v8" stroke="currentColor" stroke-width="1.6" fill="none" opacity=".7"/>
    </svg>
  </div>
  <span class="mega" aria-hidden="true">{{ edicion }}</span>
</section>

<app-itinerario-modal #modal/>
