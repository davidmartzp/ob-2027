<section class="comunidad" id="comunidad" aria-label="La comunidad" i18n-aria-label="@@nav.comunidad">
  <div class="marco" appReveal>
    <!-- el paralaje mueve .lienzo y no .marco: un transform en .marco anularía el reveal -->
    <div class="lienzo">
      <img class="foto" src="assets/foto-comunidad.jpg" alt="Foto grupal de la comunidad de Origami Bogotá frente al edificio de ladrillo del Liceo Francés Louis Pasteur" i18n-alt="@@comunidad.fotoAlt">
      <svg class="pliegues-foto" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sombraPliegue" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#14110A" stop-opacity=".32"/>
            <stop offset="1" stop-color="#14110A" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="luzPliegue" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFFDF2" stop-opacity=".22"/>
            <stop offset="1" stop-color="#FFFDF2" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <!-- la foto también está doblada: dos pliegues diagonales con sombra y luz -->
        <path d="M340 0 L520 860" stroke="#ECE7D8" stroke-width="1.4" stroke-dasharray="12 10" opacity=".55"/>
        <path d="M340 0 L520 860 L470 860 L290 0 Z" fill="url(#sombraPliegue)" opacity=".5"/>
        <path d="M1100 0 L920 860" stroke="#ECE7D8" stroke-width="1.4" stroke-dasharray="3 6 12 6" opacity=".5"/>
        <path d="M1100 0 L920 860 L970 860 L1150 0 Z" fill="url(#luzPliegue)" opacity=".6"/>
      </svg>
    </div>
  </div>
  <div class="comunidad-pie">
    <div>
      <h2 class="titulo titulo-grande" appReveal i18n="@@comunidad.titulo">La <em>comunidad</em></h2>
      <app-separador montana appReveal="1" frase="aquí nadie dobla solo ✳" i18n-frase="@@comunidad.frase"/>
    </div>
    <p appReveal="2" i18n="@@comunidad.texto">Se llega con una hoja en blanco y se sale con amigos, modelos a medio terminar y ganas de volver. En esta mesa el que lleva años plegando le explica al que llegó ayer, y los niños preguntan sin pena. Esta es la foto de 2026. En la de 2027 hay un puesto guardado para usted.</p>
  </div>
</section>
