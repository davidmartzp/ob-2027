<section class="hero" id="inicio">
  <svg class="cp" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#23211A" stroke-width="1">
      <path d="M-40 620 L1480 180" stroke-dasharray="10 8" opacity=".28"/>
      <path d="M-40 200 L1480 760" stroke-dasharray="3 7 12 7" opacity=".22"/>
      <path d="M720 -40 L720 940" stroke-dasharray="10 8" opacity=".16"/>
      <circle cx="1150" cy="300" r="220" stroke-dasharray="5 9" opacity=".2"/>
      <path d="M1150 80 L1330 480 L970 480 Z" opacity=".14"/>
    </g>
  </svg>

  <div class="hero-grid" [style.transform]="pliegue()" [style.opacity]="opacidad()">
    <div>
      <h1 class="hero-titulo">
        <span class="fila"><span>Origami</span></span>
        <span class="fila"><span><em>Bogotá</em></span></span>
        <span class="fila"><span><span class="ano">2027</span><img class="logo-ap" src="assets/logo-amigos-plegadores.png" alt="Logo de Amigos Plegadores" i18n-alt="@@comun.logoAlt"></span></span>
      </h1>
      <div class="hero-fecha" appReveal="1">
        <span class="hf-dias">{{ evento.fecha }}</span>
      </div>
      <div class="hero-meta" appReveal="2">
        <div><b>{{ evento.sede }}</b></div>
      </div>
      @if (inscripcionesAbiertas || itinerarioVisible) {
        <div class="hero-cta" appReveal="3">
          @if (inscripcionesAbiertas) {
            <a class="btn btn-naranja" href="#inscribete" i18n="@@comun.inscribeteAhora">Inscríbete ahora</a>
          }
          @if (itinerarioVisible) {
            <a class="btn btn-linea" href="#itinerario" i18n="@@hero.verItinerario">Ver itinerario</a>
          }
        </div>
      }
      <app-redes-sociales appReveal="3"/>
    </div>
    <div class="hero-lado">
      <figure class="figura">
        <img src="assets/toro-alado.jpg" alt="Toro alado de origami plegado en papel, enmarcado sobre tela oscura" i18n-alt="@@hero.toroAlt" width="1000" height="1502">
      </figure>
    </div>
  </div>
  <div class="scroll-hint" i18n="@@hero.despliega">Despliega</div>
</section>
